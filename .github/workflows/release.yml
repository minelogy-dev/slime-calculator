name: Build and Release

on:
  push:
    tags:
      - "v*"
  # 发版失败时可以手动重跑本工作流（选已有 tag 即可），不必删 tag 再推。
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

env:
  CUDA_ARCH: -arch=all-major

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: slime_calculator-linux-amd64
            arch: amd64
          #- os: ubuntu-24.04-arm
          #  artifact_name: slime_calculator-linux-arm64
          #  arch: arm64
          - os: windows-latest
            artifact_name: slime_calculator-windows-amd64
            arch: amd64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup CUDA (x86_64)
        if: matrix.arch == 'amd64'
        uses: Jimver/cuda-toolkit@v0.2.36
        id: cuda-toolkit
        with:
          # 该 action 的版本表里最高到 13.3.1（没有 13.4）。
          cuda: "13.3.1"

      - name: Verify CUDA
        if: matrix.arch == 'amd64'
        run: nvcc -V

      - name: Setup CUDA (Linux ARM64)
        if: matrix.os == 'ubuntu-24.04-arm'
        run: |
          sudo apt-get update
          sudo apt-get install -y nvidia-cuda-toolkit

      - name: Setup MSVC (Windows)
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build (Linux)
        if: matrix.os == 'ubuntu-latest' || matrix.os == 'ubuntu-24.04-arm'
        run: ./build.sh

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        shell: cmd
        run: |
          call build.bat

      - name: Package (Linux)
        if: matrix.os == 'ubuntu-latest' || matrix.os == 'ubuntu-24.04-arm'
        run: |
          mkdir -p pkg
          mv build/slime_cmp    pkg/slime_calculator_linux_${{ matrix.arch }}_cmp
          mv build/slime_main   pkg/slime_calculator_linux_${{ matrix.arch }}_main
          mv build/slime_circle pkg/slime_calculator_linux_${{ matrix.arch }}_circle
          # 只打包这三个产物：build/ 里可能还有中间文件，整目录打包会把它们一起发出去。
          ( cd pkg && zip -r ../${{ matrix.artifact_name }}.zip . )
          unzip -l ${{ matrix.artifact_name }}.zip

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path pkg | Out-Null
          Move-Item build/slime_cmp.exe    pkg/slime_calculator_windows_${{ matrix.arch }}_cmp.exe
          Move-Item build/slime_main.exe   pkg/slime_calculator_windows_${{ matrix.arch }}_main.exe
          Move-Item build/slime_circle.exe pkg/slime_calculator_windows_${{ matrix.arch }}_circle.exe
          Compress-Archive -Path pkg/* -DestinationPath ${{ matrix.artifact_name }}.zip
          Get-ChildItem pkg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
